services:
  mcp-clickhouse-cloud:
    image: ghcr.io/clickhouse/mcp-clickhouse@sha256:f4d9f1502a14a98fd17f3ecf8654bd102ba5b1a5bde86e54a9579ed8871ef8d7
    container_name: ghostslate-mcp-clickhouse-cloud
    ports:
      - '127.0.0.1:${CLICKHOUSE_CLOUD_MCP_PORT:-18000}:8000'
    environment:
      CLICKHOUSE_HOST: ${CLICKHOUSE_CLOUD_HOST:?Set CLICKHOUSE_CLOUD_HOST to the ClickHouse Cloud hostname}
      CLICKHOUSE_PORT: ${CLICKHOUSE_CLOUD_PORT:-8443}
      CLICKHOUSE_SECURE: 'true'
      CLICKHOUSE_VERIFY: 'true'
      CLICKHOUSE_USER: ${CLICKHOUSE_CLOUD_USER:?Set CLICKHOUSE_CLOUD_USER to the read-only Cloud user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_CLOUD_PASSWORD:?Set CLICKHOUSE_CLOUD_PASSWORD to the read-only Cloud password}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_CLOUD_DATABASE:-ghostslate}
      CLICKHOUSE_MCP_SERVER_TRANSPORT: sse
      CLICKHOUSE_MCP_BIND_HOST: 0.0.0.0
      CLICKHOUSE_MCP_BIND_PORT: 8000
      CLICKHOUSE_MCP_AUTH_TOKEN: ${CLICKHOUSE_MCP_AUTH_TOKEN:?Set CLICKHOUSE_MCP_AUTH_TOKEN}
      CLICKHOUSE_MCP_AUTH_DISABLED: 'false'
    restart: unless-stopped
