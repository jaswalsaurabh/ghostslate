name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-checks:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Scan tracked files for secrets
        run: ./scripts/scan-secrets.sh --all-tracked

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan tracked files for secrets
        run: ./scripts/scan-secrets.sh --all-tracked

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Line limit check
        run: pnpm check:lines

      - name: Dedupe check
        run: pnpm dedupe:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  container:
    name: Verify linux/amd64 production container
    needs: quality-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build linux/amd64 image without publishing
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --file infra/Dockerfile \
            --tag ghostslate:ci \
            --load \
            .

      - name: Verify image architecture
        run: |
          test "$(docker image inspect ghostslate:ci --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"

      - name: Verify image runs as non-root
        run: |
          test "$(docker image inspect ghostslate:ci --format '{{.Config.User}}')" = "node"

      - name: Scan image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghostslate:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln
          severity: HIGH,CRITICAL
