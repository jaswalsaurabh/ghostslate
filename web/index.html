<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/ghostslate-mark.png" />
    <link rel="apple-touch-icon" href="/brand/ghostslate-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GhostSlate AI — Autonomous SSAI Silent Bleed Forensics</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ghostslate-theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          document.documentElement.dataset.theme = theme;
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="min-h-screen text-text-primary antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
