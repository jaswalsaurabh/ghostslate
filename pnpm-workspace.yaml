packages:
  - web
  - server

allowBuilds:
  '@google/genai': true
  esbuild: true
  protobufjs: true

overrides:
  typescript: 6.0.3
  react: 19.2.8
  react-dom: 19.2.8
  zod: 4.4.3

peerDependencyRules:
  allowAny:
    - typescript

# Single source of truth for every shared dependency version.
# Packages reference these with "catalog:" instead of a literal range,
# so the same technology can never drift to two versions across the repo.
catalog:
  typescript: 6.0.3
  '@types/node': 24.13.3
  zod: 4.4.3
  pino: 10.3.1
  vitest: 4.1.11
  tsx: 4.23.12
  oxlint: 1.80.0
  oxfmt: 0.65.0
  husky: 9.1.7
  lint-staged: 17.3.0
  react: 19.2.8
  react-dom: 19.2.8
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
  lucide-react: 1.32.0
  sonner: 2.0.8
  '@tailwindcss/vite': 4.3.3
  '@vitejs/plugin-react': 6.0.5
  tailwindcss: 4.3.3
  vite: 8.2.1

minimumReleaseAgeExclude:
  - '@vitest/expect@4.1.11'
  - '@vitest/mocker@4.1.11'
  - '@vitest/pretty-format@4.1.11'
  - '@vitest/runner@4.1.11'
  - '@vitest/snapshot@4.1.11'
  - '@vitest/spy@4.1.11'
  - '@vitest/utils@4.1.11'
  - vitest@4.1.11
  - lucide-react@1.32.0
