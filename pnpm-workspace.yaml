packages:
  - web
  - server

# Single source of truth for every shared dependency version.
# Packages reference these with "catalog:" instead of a literal range,
# so the same technology can never drift to two versions across the repo.
catalog:
  typescript: 6.0.3
  '@types/node': 24.13.3
  zod: 4.4.3
  pino: 10.3.1
  vitest: 4.1.11
  tsx: 4.23.12
  eslint: 10.8.1
  typescript-eslint: 8.67.0
  prettier: 3.9.6
  react: 19.2.8
  react-dom: 19.2.8
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
